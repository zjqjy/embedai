<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>敬请期待 — EmbedAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    :root {
      --bg: #faf9f6;
      --bg-soft: #f3f1ec;
      --bg-elev: #ffffff;
      --border: rgba(26,26,31,0.08);
      --border-strong: rgba(26,26,31,0.14);
      --text: #1a1a1f;
      --text-2: rgba(26,26,31,0.7);
      --text-3: rgba(26,26,31,0.48);
      --accent: #6b9e83;
      --accent-soft: #d8e6dd;
      --accent-glow: rgba(107,158,131,0.18);
      --warm: #e8a87c;
      --warm-soft: #f7e3d0;
      --peach: #f4c6a8;
      --sky: #a8c8e0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); color: var(--text); height: 100%; }
    body {
      font-family: 'DM Sans', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 80% 0%, var(--peach) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 0% 30%, var(--sky) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 100% 80%, var(--accent-soft) 0%, transparent 60%);
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
    }
    .container { position: relative; z-index: 1; max-width: 960px; margin: 0 auto; padding: 0 2rem; width: 100%; flex: 1; display: flex; flex-direction: column; }
    .topbar {
      border-bottom: 1px solid var(--border);
      padding: 0.9rem 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-3);
    }
    .topbar-inner { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
    .status-dot {
      display: inline-block; width: 8px; height: 8px;
      background: var(--warm); border-radius: 50%;
      margin-right: 0.5rem; box-shadow: 0 0 0 4px var(--warm-soft);
      animation: pulse 2.5s ease-in-out infinite; vertical-align: middle;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 4px var(--warm-soft); }
      50% { box-shadow: 0 0 0 8px transparent; }
    }
    .topbar a { color: var(--text-2); text-decoration: none; transition: color 0.2s; }
    .topbar a:hover { color: var(--accent); }
    .topbar-links { display: flex; gap: 1.5rem; }

    .main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4rem 0; text-align: center; }
    .label {
      font-family: 'JetBrains Mono', monospace; font-size: 0.72rem;
      color: var(--text-3); text-transform: uppercase; letter-spacing: 0.1em;
      margin-bottom: 2rem;
    }
    h1 {
      font-family: 'Plus Jakarta Sans', 'PingFang SC', sans-serif;
      font-size: clamp(2.5rem, 7vw, 5rem);
      font-weight: 800; line-height: 1.05; letter-spacing: -0.03em;
      margin-bottom: 1.5rem;
    }
    h1 .accent {
      background: linear-gradient(135deg, var(--accent), var(--warm));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .lead { color: var(--text-2); font-size: 1.1rem; max-width: 500px; margin-bottom: 2.5rem; }

    .progress {
      width: 100%; max-width: 400px; height: 8px;
      background: var(--bg-soft);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 0.75rem;
      border: 1px solid var(--border);
    }
    .progress-bar {
      width: 23%; height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--warm));
      border-radius: 999px;
    }
    .progress-meta {
      font-family: 'JetBrains Mono', monospace; font-size: 0.72rem;
      color: var(--text-3); margin-bottom: 3rem;
    }

    .actions { display: flex; gap: 0.75rem; flex-wrap: wrap; justify-content: center; }
    .action {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.85rem 1.5rem;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text); text-decoration: none; font-size: 0.9rem;
      transition: background 0.2s, transform 0.2s, border-color 0.2s;
    }
    .action:hover { background: var(--accent-soft); border-color: transparent; transform: translateY(-1px); }
    .action .arrow { font-family: 'JetBrains Mono', monospace; color: var(--text-3); }
    .action:hover .arrow { color: var(--accent); }

    .footer {
      padding: 2.5rem 0; border-top: 1px dashed var(--border);
      font-family: 'JetBrains Mono', monospace; font-size: 0.72rem;
      color: var(--text-3);
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 1rem;
    }
    @media (max-width: 480px) {
      html, body { overflow-x: hidden; }
      .container { padding: 0 1.25rem; }
      .topbar-inner { font-size: 0.65rem; gap: 0.5rem; }
      .topbar-links { gap: 0.75rem; }
      h1 { font-size: 2.25rem; }
      .action { padding: 0.75rem 1.2rem; font-size: 0.85rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="topbar-inner">
        <span><span class="status-dot"></span>embedai.top &nbsp;//&nbsp; coming-soon</span>
        <div class="topbar-links">
          <a href="/">/home</a>
          <a href="/about/">/about</a>
        </div>
      </div>
    </div>

    <div class="main">
      <div class="label">// status: in-progress</div>
      <h1>Coming.<br><span class="accent">Soon.</span></h1>
      <p class="lead">这个分类还在打磨中。如果你有想看的主题，欢迎通过 B 站私信告诉我。</p>
      <div class="progress"><div class="progress-bar"></div></div>
      <div class="progress-meta">3 / 13 milestones complete</div>
      <div class="actions">
        <a href="https://b23.tv/vMZmSdE" target="_blank" rel="noopener" class="action">
          <span>B 站私信</span><span class="arrow">↗</span>
        </a>
        <a href="/" class="action">
          <span>返回首页</span><span class="arrow">→</span>
        </a>
      </div>
    </div>

    <div class="footer">
      <span>© 2026 EmbedAI</span>
      <span>embedai.top</span>
    </div>
  </div>
</body>
</html>
