<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>关于 - EmbedAI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      color: #fff;
      display: flex;
      flex-direction: column;
    }
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      width: 100%;
    }
    .about-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 2rem;
      max-width: 500px;
      text-align: center;
    }
    .intro {
      color: rgba(255,255,255,0.85);
      line-height: 1.8;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
    }
    .tech-stack {
      color: rgba(255,255,255,0.7);
      line-height: 1.8;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }
    .tech-stack strong {
      color: #667eea;
    }
    .ai-tools strong {
      color: #f093fb;
    }
    .greeting {
      color: rgba(255,255,255,0.85);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }
    .author {
      color: rgba(255,255,255,0.6);
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
    .links {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 1rem;
    }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 0.7rem 2rem;
      border-radius: 25px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: transform 0.2s;
    }
    .btn:hover {
      transform: scale(1.05);
    }
    .btn-secondary {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>
  <div class="content">
    <div class="about-card">
      <p class="intro">
        分享嵌入式技术、AI应用与提示词工程，记录学习历程。
      </p>
      <p class="tech-stack">
        <strong>技术栈</strong>：STM32 / GD32 / Arduino / ESP32 / RTOS
      </p>
      <p class="tech-stack ai-tools">
        <strong>AI工具</strong>：ChatGPT / Claude / Gemini / 各类 AI 应用
      </p>
      <p class="greeting">欢迎交流学习！</p>
      <p class="author">—— 阿程</p>
      <div class="links">
        <a href="https://b23.tv/yT4tCJd" target="_blank" class="btn">📺 B站主页</a>
        <a href="/" class="btn btn-secondary">🏠 返回首页</a>
      </div>
    </div>
  </div>
</body>
</html>
