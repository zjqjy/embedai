<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>关于 - EmbedAI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      color: #fff;
      display: flex;
      flex-direction: column;
    }
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      width: 100%;
    }
    .about-card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 1.5rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .intro {
      color: rgba(255,255,255,0.9);
      line-height: 1.7;
      margin-bottom: 1rem;
      font-size: 0.95rem;
    }
    .section {
      color: rgba(255,255,255,0.75);
      line-height: 1.7;
      font-size: 0.9rem;
      margin-bottom: 0.8rem;
    }
    .section:last-of-type {
      margin-bottom: 1.2rem;
    }
    .section strong {
      color: #667eea;
    }
    .section.ai-tools strong {
      color: #f093fb;
    }
    .greeting {
      color: rgba(255,255,255,0.9);
      font-size: 0.95rem;
      margin-bottom: 0.8rem;
    }
    .author {
      color: rgba(255,255,255,0.6);
      font-size: 0.85rem;
      margin-bottom: 1.2rem;
    }
    .links {
      display: flex;
      gap: 0.8rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 0.6rem 1.5rem;
      border-radius: 25px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(102,126,234,0.4);
    }
    @media (max-width: 480px) {
      .about-card {
        padding: 1.2rem;
        margin: 0.5rem;
      }
      .links {
        flex-direction: column;
        gap: 0.6rem;
      }
      .btn {
        width: 100%;
        justify-content: center;
        padding: 0.7rem 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="content">
    <div class="about-card">
      <p class="intro">
        分享嵌入式技术、AI应用与提示词工程，记录学习历程。
      </p>
      <p class="section">
        <strong>技术栈</strong>：STM32 / GD32 / Arduino / ESP32 / RTOS
      </p>
      <p class="section ai-tools">
        <strong>AI工具</strong>：ChatGPT / Claude / Gemini / 各类 AI 应用
      </p>
      <p class="greeting">欢迎交流学习！</p>
      <p class="author">—— 阿程</p>
      <div class="links">
        <a href="https://b23.tv/yT4tCJd" target="_blank" class="btn">📺 B站主页</a>
        <a href="/" class="btn">🏠 返回首页</a>
      </div>
    </div>
  </div>
</body>
</html>
