<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>敬请期待 — EmbedAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/css/site.css">
  <style>
    :root {
      --bg: #faf9f6;
      --bg-soft: #f3f1ec;
      --bg-elev: #ffffff;
      --border: rgba(26,26,31,0.08);
      --border-strong: rgba(26,26,31,0.14);
      --text: #1a1a1f;
      --text-2: rgba(26,26,31,0.7);
      --text-3: rgba(26,26,31,0.48);
      --accent: #6b9e83;
      --accent-soft: #d8e6dd;
      --accent-glow: rgba(107,158,131,0.18);
      --warm: #e8a87c;
      --warm-soft: #f7e3d0;
      --peach: #f4c6a8;
      --sky: #a8c8e0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); color: var(--text); height: 100%; }
    body {
      font-family: 'DM Sans', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 80% 0%, var(--peach) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 0% 30%, var(--sky) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 100% 80%, var(--accent-soft) 0%, transparent 60%);
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
    }
    .container { position: relative; z-index: 1; max-width: 960px; margin: 0 auto; padding: 0 2rem; width: 100%; flex: 1; display: flex; flex-direction: column; }
    .topbar {
      border-bottom: 1px solid var(--border);
      padding: 0.9rem 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-3);
      background: rgba(255,255,255,0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .topbar-inner { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
    .status-dot {
      display: inline-block; width: 8px; height: 8px;
      background: var(--warm); border-radius: 50%;
      margin-right: 0.5rem; box-shadow: 0 0 0 4px var(--warm-soft);
      animation: pulse 2.5s ease-in-out infinite; vertical-align: middle;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 4px var(--warm-soft); }
      50% { box-shadow: 0 0 0 8px transparent; }
    }
    .topbar a {
      color: var(--text-2); text-decoration: none; transition: color 0.2s;
      padding: 0.25rem 0.4rem; border-radius: 6px;
    }
    .topbar a:hover { color: var(--accent); background: var(--accent-soft); }
    .topbar-links { display: flex; gap: 0.5rem; }

    .main {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 4rem 0; text-align: center;
      position: relative;
    }
    .label {
      font-family: 'JetBrains Mono', monospace; font-size: 0.72rem;
      color: var(--text-3); text-transform: uppercase; letter-spacing: 0.1em;
      margin-bottom: 2rem;
    }
    h1 {
      font-family: 'Plus Jakarta Sans', 'PingFang SC', sans-serif;
      font-size: clamp(2.5rem, 7vw, 5rem);
      font-weight: 800; line-height: 1.05; letter-spacing: -0.03em;
      margin-bottom: 1.5rem;
    }
    h1 .accent {
      background: linear-gradient(135deg, var(--accent), var(--warm));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .lead { color: var(--text-2); font-size: 1.1rem; max-width: 500px; margin-bottom: 2.5rem; }

    /* 进度条 */
    .progress-wrap {
      width: 100%; max-width: 400px;
      margin-bottom: 0.75rem;
    }
    .progress {
      width: 100%; height: 8px;
      background: var(--bg-soft);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border);
      position: relative;
    }
    .progress-bar {
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--warm));
      border-radius: 999px;
      transition: width 1.6s cubic-bezier(0.2, 0.8, 0.2, 1);
      position: relative;
    }
    .progress-bar::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.5) 50%, transparent 100%);
      animation: progress-shimmer 2.4s linear infinite;
    }
    @keyframes progress-shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    .progress-meta {
      font-family: 'JetBrains Mono', monospace; font-size: 0.72rem;
      color: var(--text-3); margin-bottom: 3rem;
    }
    .progress-meta b { color: var(--text); font-weight: 600; }

    /* 阶段标签 */
    .milestones {
      display: flex; gap: 0.5rem; flex-wrap: wrap;
      justify-content: center; margin-bottom: 2.5rem;
    }
    .milestone {
      font-family: 'JetBrains Mono', monospace; font-size: 0.7rem;
      padding: 0.35rem 0.7rem; border-radius: 999px;
      background: var(--bg-elev); border: 1px solid var(--border);
      color: var(--text-3);
      transition: background 0.2s, color 0.2s, transform 0.2s;
    }
    .milestone.is-done {
      background: var(--accent-soft); color: #4a7a64; border-color: transparent;
    }
    .milestone.is-done::before { content: '✓ '; }
    .milestone:hover { transform: translateY(-1px); }
    .milestone.is-current {
      background: var(--warm-soft); color: #b37045; border-color: transparent;
    }
    .milestone.is-current::before { content: '● '; }

    /* 操作按钮 */
    .actions { display: flex; gap: 0.75rem; flex-wrap: wrap; justify-content: center; }
    .action {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.85rem 1.5rem;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text); text-decoration: none; font-size: 0.9rem;
      transition: background 0.2s, transform 0.2s, border-color 0.2s;
      cursor: pointer;
    }
    .action:hover { background: var(--accent-soft); border-color: transparent; transform: translateY(-1px); color: var(--text); }
    .action.primary { background: linear-gradient(135deg, var(--accent), var(--warm)); color: white; border-color: transparent; }
    .action.primary:hover { filter: brightness(1.05); }
    .action .arrow { font-family: 'JetBrains Mono', monospace; color: var(--text-3); }
    .action.primary .arrow { color: rgba(255,255,255,0.85); }

    /* 隐藏彩蛋 */
    .secret {
      position: fixed; bottom: 1rem; left: 50%;
      transform: translateX(-50%) translateY(20px);
      font-family: 'JetBrains Mono', monospace; font-size: 0.72rem;
      color: var(--text-3); opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .secret.is-shown { opacity: 1; transform: translateX(-50%) translateY(0); }
    .secret kbd {
      font-family: inherit; font-size: 0.7rem;
      background: var(--bg-soft); border: 1px solid var(--border);
      padding: 0.05rem 0.35rem; border-radius: 4px;
      margin: 0 0.1rem;
    }

    /* 浮动光斑 */
    .floaty {
      position: absolute; border-radius: 50%; pointer-events: none; opacity: 0.45;
      filter: blur(40px);
      will-change: transform;
    }
    .floaty-1 {
      top: 15%; left: 10%; width: 180px; height: 180px;
      background: var(--peach);
    }
    .floaty-2 {
      bottom: 10%; right: 8%; width: 220px; height: 220px;
      background: var(--sky);
    }

    .footer {
      padding: 2.5rem 0; border-top: 1px dashed var(--border);
      font-family: 'JetBrains Mono', monospace; font-size: 0.72rem;
      color: var(--text-3);
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 1rem;
    }
    @media (max-width: 480px) {
      html, body { overflow-x: hidden; }
      .container { padding: 0 1.25rem; }
      .topbar-inner { font-size: 0.65rem; gap: 0.5rem; }
      .topbar-links { gap: 0.4rem; }
      h1 { font-size: 2.25rem; }
      .action { padding: 0.75rem 1.2rem; font-size: 0.85rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar" data-reveal="fade">
      <div class="topbar-inner">
        <span><span class="status-dot"></span>阿程的碎碎念 &nbsp;//&nbsp; coming-soon</span>
        <div class="topbar-links">
          <a href="/" data-magnetic="0.25">/home</a>
          <a href="/about/" data-magnetic="0.25">/about</a>
        </div>
      </div>
    </div>

    <div class="main">
      <span class="floaty floaty-1" data-parallax="0.1"></span>
      <span class="floaty floaty-2" data-parallax="-0.12"></span>

      <div class="label" data-reveal="up">// status: in-progress</div>
      <h1 data-reveal="up" data-reveal-delay="1">在写.<br><span class="accent" data-char-in>慢慢贴.</span></h1>
      <p class="lead" data-reveal="up" data-reveal-delay="2">这几个分类还在打磨。想看什么主题，私信告诉我，会优先写。</p>

      <div class="progress-wrap" data-reveal="up" data-reveal-delay="3">
        <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
      </div>
      <div class="progress-meta" data-reveal="up" data-reveal-delay="3"><b>3</b> / <b>13</b> milestones complete · <b>23%</b></div>

      <div class="milestones" data-reveal="up" data-reveal-delay="4" id="milestones">
        <span class="milestone is-done" style="transition-delay:.1s">架构草图</span>
        <span class="milestone is-done" style="transition-delay:.18s">选题规划</span>
        <span class="milestone is-done" style="transition-delay:.26s">骨架部署</span>
        <span class="milestone is-current" style="transition-delay:.34s">样例笔记</span>
        <span class="milestone" style="transition-delay:.42s">专题 ①</span>
        <span class="milestone" style="transition-delay:.5s">专题 ②</span>
        <span class="milestone" style="transition-delay:.58s">专题 ③</span>
        <span class="milestone" style="transition-delay:.66s">复刻项目</span>
        <span class="milestone" style="transition-delay:.74s">硬件实测</span>
        <span class="milestone" style="transition-delay:.82s">读者反馈</span>
        <span class="milestone" style="transition-delay:.9s">V1.0</span>
        <span class="milestone" style="transition-delay:.98s">彩蛋</span>
        <span class="milestone" style="transition-delay:1.06s">上线</span>
      </div>

      <div class="actions" data-reveal="up" data-reveal-delay="4">
        <a href="https://b23.tv/vMZmSdE" target="_blank" rel="noopener" class="action primary" data-magnetic="0.3" data-ripple>
          <span>B 站私信</span><span class="arrow">↗</span>
        </a>
        <a href="/" class="action" data-magnetic="0.3" data-ripple>
          <span>返回首页</span><span class="arrow">→</span>
        </a>
        <button type="button" class="action" id="cheerBtn" data-magnetic="0.3" data-ripple>
          <span>✨ 给我加 buff</span>
        </button>
      </div>
    </div>

    <div class="footer">
      <span>© 2026 阿程 · embedai.top</span>
      <span>阿程的碎碎念</span>
    </div>
  </div>

  <div class="secret" id="secret">彩蛋触发!试试 <kbd>↑</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd><kbd>←</kbd><kbd>→</kbd><kbd>B</kbd><kbd>A</kbd></div>

  <script src="/js/site.js"></script>
  <script src="/js/confetti.js"></script>
  <script>
    // 进度条入场动画
    (function () {
      const bar = document.getElementById('progressBar');
      if (!bar) return;
      const io = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              bar.style.width = '23%';
              io.unobserve(entry.target);
            }
          });
        },
        { threshold: 0.3 }
      );
      io.observe(bar);
    })();

    // 里程碑入场
    (function () {
      const wrap = document.getElementById('milestones');
      if (!wrap) return;
      const items = wrap.querySelectorAll('.milestone');
      items.forEach((m, i) => {
        m.style.opacity = '0';
        m.style.transform = 'translateY(8px)';
        m.style.transition = 'opacity 0.5s ease, transform 0.5s ease, background 0.2s, color 0.2s';
      });
      const io = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              items.forEach((m) => {
                m.style.opacity = '1';
                m.style.transform = 'translateY(0)';
              });
              io.unobserve(entry.target);
            }
          });
        },
        { threshold: 0.3 }
      );
      io.observe(wrap);
    })();

    // 加 buff 按钮
    (function () {
      const btn = document.getElementById('cheerBtn');
      const meta = document.querySelector('.progress-meta');
      if (!btn) return;
      const phrases = [
        { text: '3 / 13 milestones complete · 25%', w: 25 },
        { text: '4 / 13 milestones complete · 31%', w: 31 },
        { text: '5 / 13 milestones complete · 38%', w: 38 },
        { text: '6 / 13 milestones complete · 46%', w: 46 },
        { text: '7 / 13 milestones complete · 54%', w: 54 }
      ];
      let i = 0;
      btn.addEventListener('click', (e) => {
        const r = btn.getBoundingClientRect();
        window.dispatchEvent(new CustomEvent('confetti', {
          detail: { x: e.clientX, y: e.clientY, count: 80 }
        }));
        if (i >= phrases.length) return;
        const p = phrases[i++];
        if (meta) meta.innerHTML = '<b>' + p.text.replace(' · ', '</b> · <b>') + '</b>';
        const bar = document.getElementById('progressBar');
        if (bar) bar.style.width = p.w + '%';
      });
    })();

    // Konami 彩蛋
    (function () {
      const secret = document.getElementById('secret');
      if (!secret) return;
      const code = [
        'ArrowUp','ArrowUp','ArrowDown','ArrowDown',
        'ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'
      ];
      let pos = 0;
      let timer = null;
      document.addEventListener('keydown', (e) => {
        const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
        if (k === code[pos]) {
          pos++;
          clearTimeout(timer);
          timer = setTimeout(() => { pos = 0; }, 1500);
          if (pos === code.length) {
            pos = 0;
            secret.classList.add('is-shown');
            window.dispatchEvent(new CustomEvent('confetti', {
              detail: { x: window.innerWidth / 2, y: window.innerHeight / 2, count: 120 }
            }));
            setTimeout(() => secret.classList.remove('is-shown'), 6000);
          }
        } else {
          pos = 0;
        }
      });
    })();
  </script>
</body>
</html>
