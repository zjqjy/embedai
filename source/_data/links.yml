# ============================================
# 链接中央注册表 (按文章嵌套)
# ============================================
# 结构：每篇文章一个 section，下面是该文章用到的链接数组
# helper {% link "key" %} 跨文章查找，找到第一个匹配即用
# 改一处全站更新（工具页 + 所有文章）
#
# 字段说明:
#   key:           英文短标识，文章用 {% link "key" %} 引用
#   label:         显示名（按钮/链接文本）
#   url:           实际地址
#   type:          分类（baidu/official/github/script/signup/doc）
#   extract_code?: 提取码（仅 type=baidu）
#   note?:         备注（添加日期/失效警告/替代关系）
#   status:        active(正常) / warning(警告,可能过期) / broken(失效)
#   added:         添加日期（YYYY-MM-DD）
# ============================================

