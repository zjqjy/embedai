<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EmbedAI - 嵌入式与AI技术分享</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f1a;
      color: #fff;
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 背景装饰 */
    .bg-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      overflow: hidden;
    }
    .bg-gradient {
      position: absolute;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(102,126,234,0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(118,75,162,0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(240,147,251,0.08) 0%, transparent 60%);
    }
    .grid-overlay {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image:
        linear-gradient(rgba(102,126,234,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(102,126,234,0.03) 1px, transparent 1px);
      background-size: 50px 50px;
    }
    .floating-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      animation: float 8s ease-in-out infinite;
    }
    .orb-1 {
      width: 300px;
      height: 300px;
      background: rgba(102,126,234,0.3);
      top: -100px;
      left: -100px;
      animation-delay: 0s;
    }
    .orb-2 {
      width: 250px;
      height: 250px;
      background: rgba(240,147,251,0.25);
      top: 50%;
      right: -80px;
      animation-delay: -2s;
    }
    .orb-3 {
      width: 200px;
      height: 200px;
      background: rgba(118,75,162,0.3);
      bottom: -50px;
      left: 30%;
      animation-delay: -4s;
    }
    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -30px) scale(1.05); }
      66% { transform: translate(-20px, 20px) scale(0.95); }
    }

    /* 浮动粒子 */
    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(255,255,255,0.5);
      border-radius: 50%;
      animation: particle-float 15s linear infinite;
    }
    @keyframes particle-float {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
    }

    /* 主内容 */
    .container {
      position: relative;
      z-index: 1;
      max-width: 1000px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    /* Hero */
    .hero {
      text-align: center;
      padding: 4rem 2rem;
      margin-bottom: 2rem;
    }
    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.2);
      margin-bottom: 1.5rem;
      object-fit: cover;
      box-shadow: 0 0 30px rgba(102,126,234,0.5);
    }
    .hero h1 {
      font-size: 2.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #fff 0%, #a5b4fc 50%, #667eea 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }
    .hero p {
      font-size: 1.1rem;
      color: rgba(255,255,255,0.7);
      margin-bottom: 1rem;
    }
    .notice {
      display: inline-block;
      background: linear-gradient(135deg, rgba(102,126,234,0.3), rgba(118,75,162,0.3));
      border: 1px solid rgba(255,255,255,0.1);
      padding: 0.5rem 1.5rem;
      border-radius: 50px;
      font-size: 0.9rem;
      color: rgba(255,255,255,0.9);
    }

    /* 分类卡片 */
    .section { margin-bottom: 2rem; }
    .section-title {
      font-size: 1.1rem;
      color: rgba(255,255,255,0.9);
      margin-bottom: 1rem;
      padding-left: 1rem;
      border-left: 3px solid #667eea;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }
    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 1.5rem;
      text-decoration: none;
      color: #fff;
      transition: all 0.3s;
      backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(102,126,234,0.1), rgba(118,75,162,0.1));
      opacity: 0;
      transition: opacity 0.3s;
    }
    .card:hover {
      transform: translateY(-5px);
      border-color: rgba(102,126,234,0.4);
      box-shadow: 0 10px 40px rgba(102,126,234,0.2);
    }
    .card:hover::before {
      opacity: 1;
    }
    .card-content {
      position: relative;
      z-index: 1;
    }
    .card .icon { font-size: 2rem; margin-bottom: 0.75rem; }
    .card .title { font-size: 1rem; font-weight: 600; margin-bottom: 0.5rem; }
    .card .desc { font-size: 0.85rem; color: rgba(255,255,255,0.6); line-height: 1.5; }
    .card .badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: linear-gradient(135deg, #f093fb, #f5576c);
      color: white;
      font-size: 0.65rem;
      font-weight: 600;
      padding: 0.2rem 0.5rem;
      border-radius: 20px;
    }

    /* 关于 */
    .about {
      text-align: center;
      padding: 2rem;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      margin-top: 1rem;
    }
    .about p { color: rgba(255,255,255,0.7); font-size: 0.95rem; margin-bottom: 1rem; }
    .about .links { display: flex; justify-content: center; gap: 1.5rem; flex-wrap: wrap; }
    .about .links a { color: #a5b4fc; text-decoration: none; font-size: 0.9rem; transition: color 0.2s; }
    .about .links a:hover { color: #fff; }

    /* 底部 */
    .footer {
      text-align: center;
      padding: 2rem 0 1rem;
      color: rgba(255,255,255,0.4);
      font-size: 0.8rem;
    }

    @media (max-width: 768px) {
      .hero h1 { font-size: 2rem; }
      .hero { padding: 3rem 1.5rem; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

      <div class="links">

  </div>
</body>
</html>
