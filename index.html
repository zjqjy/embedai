  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8f9fa;
      color: #333;
      line-height: 1.6;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 1.5rem;
    }
    .hero {
      text-align: center;
      padding: 3rem 2rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 16px;
      margin-bottom: 2rem;
      color: white;
    }
    .hero h1 { font-size: 2.5rem; margin-bottom: 0.5rem; color: white; }
    .hero p { font-size: 1.1rem; opacity: 0.95; }
    .hero .notice {
      margin-top: 1rem;

      background: rgba(255,255,255,0.2);
      padding: 0.5rem 1.5rem;
      border-radius: 50px;
      font-size: 0.9rem;
    }
    .section { margin-bottom: 1.5rem; }
    .section h2 {
      font-size: 1.2rem;
      margin-bottom: 0.75rem;
      padding-left: 0.5rem;
      border-left: 4px solid #667eea;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 1.25rem;
      text-decoration: none;
      color: #333;
      transition: all 0.3s;
      border: 1px solid #e1e1e1;
      text-align: center;
      display: block;
      position: relative;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(102,126,234,0.15);
      border-color: #667eea;
      color: #333;
    }
    .card .icon { font-size: 2rem; margin-bottom: 0.5rem; }
    .card .title { font-size: 1rem; font-weight: 600; margin-bottom: 0.3rem; }
    .card .desc { font-size: 0.8rem; color: #666; line-height: 1.4; }
    .card .badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: linear-gradient(135deg, #f093fb, #f5576c);
      color: white;
      font-size: 0.6rem;
      font-weight: 600;
      padding: 0.15rem 0.4rem;
      border-radius: 20px;
    }
    .about {
      text-align: center;
      padding: 1.5rem;
      background: #fff;
      border-radius: 12px;
      border: 1px solid #e1e1e1;
    }
    .about p { color: #666; font-size: 0.9rem; margin-bottom: 1rem; }
    .about .links { display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap; }
    .about .links a { color: #667eea; text-decoration: none; font-size: 0.85rem; }
    .about .links a:hover { text-decoration: underline; }
    @media (max-width: 768px) {
      .grid-3 { grid-template-columns: 1fr; }
      .hero h1 { font-size: 2rem; }
      .hero { padding: 2rem 1.5rem; }
    }
  </style>
