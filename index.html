<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EmbedAI - 嵌入式与AI技术分享</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      color: #fff;
      line-height: 1.6;
    }

    .hero {
      text-align: center;
      padding: 5rem 2rem 3rem;
      background: linear-gradient(180deg, rgba(102,126,234,0.2) 0%, transparent 100%);
    }
    .hero h1 {
      font-size: 3.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }
    .hero p {
      font-size: 1.2rem;
      color: rgba(255,255,255,0.7);
    }
    .hero .notice {
      margin-top: 2rem;
      padding: 1rem 2rem;
      background: rgba(102,126,234,0.2);
      border-radius: 50px;
      display: inline-block;
      border: 1px solid rgba(102,126,234,0.3);
    }
    .hero .notice span {
      color: #667eea;
      font-weight: 600;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 1.5rem 3rem;
    }

    .section-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .section-title::before {
      content: '';
      width: 4px;
      height: 1.2rem;
      background: linear-gradient(180deg, #667eea, #764ba2);
      border-radius: 2px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 2.5rem;
    }

    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 1.5rem;
      text-align: center;
      transition: all 0.3s;
      text-decoration: none;
      color: #fff;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #667eea, #764ba2);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .card:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(102,126,234,0.5);
      transform: translateY(-2px);
    }
    .card:hover::before {
      opacity: 1;
    }
    .card .icon {
      font-size: 2rem;
      margin-bottom: 0.75rem;
    }
    .card .title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .card .desc {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.5);
      line-height: 1.4;
    }
    .card .badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: linear-gradient(135deg, #f093fb, #f5576c);
      font-size: 0.65rem;
      font-weight: 600;
      padding: 0.2rem 0.5rem;
      border-radius: 20px;
      text-transform: uppercase;
    }

    .about {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 2rem;
      text-align: center;
    }
    .about p {
      color: rgba(255,255,255,0.6);
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
    }
    .about .links {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }
    .about .links a {
      color: #667eea;
      text-decoration: none;
      font-size: 0.9rem;
      padding: 0.5rem 1rem;
      background: rgba(102,126,234,0.1);
      border-radius: 20px;
      transition: all 0.2s;
    }
    .about .links a:hover {
      background: rgba(102,126,234,0.2);
    }
    .about .links a .icon {
      margin-right: 0.3rem;
    }

    @media (max-width: 768px) {
      .hero h1 { font-size: 2.5rem; }
      .hero { padding: 3rem 1.5rem 2rem; }
      .grid { grid-template-columns: 1fr; }
      .about .links { gap: 0.75rem; }
    }
  </style>
</head>
<body>
  <section class="hero">
    <h1>EmbedAI</h1>
    <p>嵌入式技术 | AI人工智能 | 提示词工程</p>
    <div class="notice">
      🎉 网站正在建设中... <span>敬请期待！</span>
    </div>
  </section>

  <div class="container">
    <!-- 嵌入式技术 -->
    <h2 class="section-title">🚀 嵌入式技术</h2>
    <div class="grid">
      <a class="card" href="/coming-soon/">
        <span class="badge">期待</span>
        <div class="icon">📦</div>
        <div class="title">开源项目</div>
        <div class="desc">分享个人和社区的开源嵌入式项目</div>
      </a>
      <a class="card" href="/coming-soon/">
        <span class="badge">期待</span>
        <div class="icon">🔧</div>
        <div class="title">开源复刻</div>
        <div class="desc">优秀开源项目的复刻与改进</div>
      </a>
      <a class="card" href="/coming-soon/">
        <span class="badge">期待</span>
        <div class="icon">📝</div>
        <div class="title">技术文章</div>
        <div class="desc">STM32、Arduino、RTOS等技术分享</div>
      </a>
    </div>

    <!-- AI 应用 -->
    <h2 class="section-title">🤖 AI 应用</h2>
    <div class="grid">
      <a class="card" href="/coming-soon/">
        <span class="badge">期待</span>
        <div class="icon">💡</div>
        <div class="title">AI 工具使用</div>
        <div class="desc">ChatGPT、Claude 等 AI 工具使用技巧</div>
      </a>
      <a class="card" href="/coming-soon/">
        <span class="badge">期待</span>
        <div class="icon">📝</div>
        <div class="title">提示词工程</div>
        <div class="desc">高效提示词编写与优化技巧</div>
      </a>
      <a class="card" href="/coming-soon/">
        <span class="badge">期待</span>
        <div class="icon">🤖</div>
        <div class="title">AI 人工智能</div>
        <div class="desc">AI 技术原理与应用探索</div>
      </a>
    </div>

    <!-- 关于 -->
    <div class="about">
      <p>分享嵌入式技术、AI应用与提示词工程，记录学习历程。</p>
      <div class="links">
        <a href="/about/"><span class="icon">👤</span>关于本站</a>
        <a href="https://space.bilibili.com/478531832" target="_blank"><span class="icon">📺</span>B站</a>
        <a href="https://b23.tv/yT4tCJd" target="_blank"><span class="icon">🎬</span>视频</a>
      </div>
    </div>
  </div>
</body>
</html>
